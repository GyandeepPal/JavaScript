<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Dom</title>
</head>
<style>
    *{
    padding: 0%;
    margin: auto;
}


</style>
<body>
    <div class="container">
       <div="box" style="background-color: aquamarine;">
        Hey I am gyan
        <br>
        <div="box" style="background-color:rgba(255, 0, 0, 0.518)" >Hey I am gyan</div>
    </div>
       
    </div>
<script>
    let div =document.createElement("div");
    div.innerHTML="I have been inserted <b> Gyan Bhai What are you doing right now</b>"

    div.setAttribute("class","created")
    document.querySelector(".container").append(div)

</script>
</body>


</html>
