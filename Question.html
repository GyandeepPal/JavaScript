// Question.

//   Given products [{name:'Pen',price:20,inStock:true}, {name:'Book',price:150,inStock:false},
// {name:'Bag',price:500,inStock:true}], 
// filter only in-stock items, apply 10% discount with map(),
//  then use reduce() to
// get the total price.

const products = [
    { name: 'Pen', price: 20, inStock: true },
    { name: 'Book', price: 150, inStock: false },
    { name: 'Bag', price: 500, inStock: true }
];

// Step 1: Filter in-stock products
const inStockProducts = products.filter(product => product.inStock);

// Step 2: Apply 10% discount
const discountedProducts = inStockProducts.map(product => ({
    ...product,
    price: product.price * 0.9
}));

// Step 3: Calculate total price
const totalPrice = discountedProducts.reduce(
    (sum, product) => sum + product.price,
    0
);

console.log("In Stock Products:", inStockProducts);
console.log("Discounted Products:", discountedProducts);
console.log("Total Price:", totalPrice);
